[workspace]
resolver = "2"
members = [
    "bilkrnl-core",
    "kernel",
    "tests",
    "tools/bil1asm",
]
default-members = ["bilkrnl-core", "tests", "tools/bil1asm"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
version = "0.1.0"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[profile.dev]
panic = "abort"
